<!DOCTYPE html>
<html>
<body>
<title>Textutils</title>
<h1>Welcome to the text analyazer.Enter your text below</h1>
<form action="/analyze" method="get">
    <textarea name="text" style="margin:0px; width: 721px; height: 93px;">enter a text</textarea><br>
    <input type="checkbox" name="removepunc">Remove Punctuation<br>
    <input type="checkbox" name="fullcaps">Uppercase<br>
    <input type="checkbox" name="Newline_remover">Newline remover<br>

    <button type="submit">Analyze Text</button>
</form>
</body>
</html>
